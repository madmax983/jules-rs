[package]
name = "jules-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
visualizer = []
analytics = []
report = ["visualizer", "analytics"]
narrator = []
tui = ["dep:ratatui", "dep:crossterm"]
player = ["dep:crossterm"]
doctor = []
scout = []
comparator = []
auditor = ["analytics", "doctor"]
heatmap = ["analytics"]
reviewer = []
risk_heatmap = ["reviewer", "heatmap"]
web = ["dep:autumn-web", "dep:maud"]

[dependencies]
fs2 = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.27", optional = true }
autumn-web = { version = "0.5.0", optional = true, default-features = false, features = ["maud", "htmx"] }
maud = { version = "0.27", optional = true, features = ["axum"] }

[dev-dependencies]
fs2 = "0.4.3"
wiremock = "0.6"

[[bin]]
name = "director"
path = "src/bin/director.rs"

[[bin]]
name = "jules-monitor"
path = "src/bin/monitor.rs"
required-features = ["tui"]

[[bin]]
name = "jules-player"
path = "src/bin/player.rs"
required-features = ["player"]

[[bin]]
name = "jules-web"
path = "src/bin/web.rs"
required-features = ["web"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
