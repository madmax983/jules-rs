[package]
name = "jules-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
visualizer = []
analytics = []
report = ["visualizer", "analytics"]

[dependencies]
fs2 = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
fs2 = "0.4.3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
